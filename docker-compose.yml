version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: supportdesk_postgres
    restart: always
    environment:
      POSTGRES_USER: supportdesk_user
      POSTGRES_PASSWORD: supportdesk_password
      POSTGRES_DB: supportdesk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk_user -d supportdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportdesk_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://supportdesk_user:supportdesk_password@db:5432/supportdesk_db
      SECRET_KEY: ${SECRET_KEY:-supportdesk-production-secret-key-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportdesk_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
